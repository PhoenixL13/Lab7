
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Basic JavaScript Event Handling and DOM</title>
</head>
<body>

    <h1>Basic JavaScript Event Handling and DOM</h1>

    <p>Remember to watch the video in the repository to see how your output should function</p>

    <input type="text" id="messageInput" placeholder="Enter a Message">
    <br>

    <button onclick="showAlert()">Alert Me</button>

    <h2>Show results here</h2>
    <div id="results"></div>

    <script>
        function showAlert() {
            // Get the input value
            let message = document.getElementById("messageInput").value;

            // Display an alert
            alert(message);

            // Display the message in the results section
            document.getElementById("results").innerHTML = message;
        }
    </script>

</body>
</html>
